name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.27.0"
  # Pinned so a lint run is reproducible. Bump deliberately.
  GOLANGCI_LINT_VERSION: "v2.13.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # golangci-lint is installed from source rather than through
      # golangci-lint-action or a release binary, and that is deliberate: a
      # golangci-lint built with an older Go refuses a module whose go directive
      # is newer than its own —
      #
      #   can't load config: the Go language version (go1.26) used to build
      #   golangci-lint is lower than the targeted Go version (1.27)
      #
      # This module needs 1.27 for generic methods, so the linter has to be
      # built with 1.27 too. Once upstream ships releases built with 1.27 this
      # can go back to the action.
      - name: install golangci-lint (built with this Go)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: lint
        run: golangci-lint run ./...

      - name: formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
